const STATUS_KEY = 'lm_status_v2';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(STATUS_KEY)||'{}'); } catch(e) {}

let filterMode = 'all';
let searchQ = '';

function save() {
  try { localStorage.setItem(STATUS_KEY, JSON.stringify(statuses)); } catch(e){}
}

function getStatus(id) { return statuses[id] || 'todo'; }

function cycleStatus(id) {
  const cur = getStatus(id);
  statuses[id] = cur==='todo' ? 'inprog' : cur==='inprog' ? 'done' : 'todo';
  save();
  render();
}

function allTasks() {
  return PHASES.flatMap(p => p.weeks.flatMap(w => w.tasks));
}

function renderStats() {
  const all = allTasks();
  const done = all.filter(t => getStatus(t.id)==='done').length;
  const inp = all.filter(t => getStatus(t.id)==='inprog').length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  const uyenT = all.filter(t=>t.who==='uyen').length;
  const phuongT = all.filter(t=>t.who==='phuong').length;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Tổng tasks</div>
      <div class="stat-value">${all.length}</div>
      <div class="stat-sub">${PHASES.length} phases</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Hoàn thành</div>
      <div class="stat-value">${done}</div>
      <div class="stat-sub">${pct}%</div>
      <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Đang làm</div>
      <div class="stat-value">${inp}</div>
      <div class="stat-sub">in progress</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tasks Uyên</div>
      <div class="stat-value">${uyenT}</div>
      <div class="stat-sub">Frontend</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tasks Phương</div>
      <div class="stat-value">${phuongT}</div>
      <div class="stat-sub">Backend</div>
    </div>
  `;
}

function taskVisible(t) {
  if (filterMode==='uyen' && t.who!=='uyen') return false;
  if (filterMode==='phuong' && t.who!=='phuong') return false;
  if (filterMode==='done' && getStatus(t.id)!=='done') return false;
  if (filterMode==='inprog' && getStatus(t.id)!=='inprog') return false;
  if (filterMode==='todo' && getStatus(t.id)!=='todo') return false;
  if (filterMode==='high' && t.pri!=='high') return false;
  if (searchQ && !t.text.toLowerCase().includes(searchQ)) return false;
  return true;
}

function render() {
  renderStats();
  const root = document.getElementById('phases-root');
  root.innerHTML = '';
  PHASES.forEach((ph, pi) => {
    const visibleTasks = ph.weeks.flatMap(w=>w.tasks).filter(taskVisible);
    const allT = ph.weeks.flatMap(w=>w.tasks);
    const doneT = allT.filter(t=>getStatus(t.id)==='done').length;
    const pct = allT.length ? Math.round(doneT/allT.length*100) : 0;

    const block = document.createElement('div');
    block.className = 'phase-block';
    block.dataset.phase = pi;

    block.innerHTML = `
      <div class="phase-hdr" onclick="togglePhase(this.parentElement)">
        <div class="phase-dot"></div>
        <span class="phase-name">${ph.name}</span>
        <span class="phase-meta">${doneT}/${allT.length} — ${pct}%</span>
        <i class="ti ti-chevron-down phase-chevron" aria-hidden="true"></i>
      </div>
      <div class="phase-body" id="phase-body-${pi}"></div>
    `;

    root.appendChild(block);
    const body = block.querySelector('.phase-body');

    let hasAny = false;
    ph.weeks.forEach(wk => {
      const wkTasks = wk.tasks.filter(taskVisible);
      if (wkTasks.length === 0 && (filterMode!=='all' || searchQ)) return;
      hasAny = true;
      const wkDone = wk.tasks.filter(t=>getStatus(t.id)==='done').length;
      const wDiv = document.createElement('div');
      wDiv.innerHTML = `
        <div class="week-hdr">
          <span class="week-label">${wk.label}</span>
          <span class="week-prog">${wkDone}/${wk.tasks.length}</span>
        </div>
      `;
      body.appendChild(wDiv);
      wk.tasks.forEach(t => {
        const vis = taskVisible(t);
        const st = getStatus(t.id);
        const tr = document.createElement('div');
        tr.className = 'task-row' + (st==='done'?' is-done':'') + (!vis?' hidden':'');
        const chkCls = st==='done'?'chk done':st==='inprog'?'chk inprog':'chk';
        const chkIcon = st==='done'?'<i class="ti ti-check" aria-hidden="true"></i>':st==='inprog'?'<i class="ti ti-dots" aria-hidden="true"></i>':'';
        const whoBadge = t.who==='uyen'?'<span class="badge badge-uyen">Uyên</span>':'<span class="badge badge-phuong">Phương</span>';
        const priCls = t.pri==='high'?'badge-priority-high':t.pri==='med'?'badge-priority-med':'badge-priority-low';
        const priLabel = t.pri==='high'?'Cao':t.pri==='med'?'Trung bình':'Thấp';
        tr.innerHTML = `
          <div class="${chkCls}" onclick="cycleStatus('${t.id}')" title="Click để đổi trạng thái" role="button" aria-label="Trạng thái task">${chkIcon}</div>
          <div class="task-body">
            <div class="task-text">${t.text}</div>
            <div class="task-meta-row">
              ${whoBadge}
              <span class="badge badge-cat">${t.cat}</span>
              <span class="badge ${priCls}">${priLabel}</span>
            </div>
          </div>
        `;
        body.appendChild(tr);
      });
    });

    if (!hasAny && (filterMode!=='all' || searchQ)) {
      body.innerHTML += `<div class="empty-msg"><i class="ti ti-search" aria-hidden="true"></i> Không có task nào khớp với bộ lọc</div>`;
    }
  });
}

function togglePhase(el) {
  el.classList.toggle('collapsed');
}

function setFilter(f, btn) {
  filterMode = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function doSearch(v) {
  searchQ = v.toLowerCase().trim();
  render();
}

render();
</script>
