<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ListenMind · Project Tracker</title>
  <!-- Tabler Icons (giữ đồng bộ phong cách icon với thiết kế tracker gốc) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    /* Reset & base – giữ đúng thiết kế từ file cung cấp */
    :root {
      --accent-yen: #185FA5;
      --accent-phuong: #0F6E56;
      --bg-card: var(--color-background-primary);
      --border: var(--color-border-tertiary);
      --text-main: var(--color-text-primary);
      --text-muted: var(--color-text-secondary);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-background-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
    }

    /* Light / Dark theme tương thích với CSS variables của hệ thống (giống nguyên bản tracker) */
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f8fafc;
      --color-border-tertiary: rgba(0, 0, 0, 0.08);
      --color-border-secondary: rgba(0, 0, 0, 0.12);
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1a1a1a;
        --color-background-secondary: #242424;
        --color-border-tertiary: rgba(255, 255, 255, 0.08);
        --color-border-secondary: rgba(255, 255, 255, 0.12);
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #a0a0a0;
      }
      .badge-uyen { background: #1c3f5c; color: #bbd4f5; border-color: #2c5780; }
      .badge-phuong { background: #1a4f42; color: #b2e0d2; border-color: #217a64; }
      .badge-cat { background: #2d2d2d; color: #b0b0b0; border-color: #3f3f3f; }
      .badge-priority-high { background: #421e1e; color: #f3b5b5; border-color: #832f2f; }
      .badge-priority-med { background: #4a3516; color: #f8d99e; border-color: #a57228; }
      .badge-priority-low { background: #1a3a1a; color: #b3dc8f; border-color: #3c7e1a; }
    }

    .wrap { padding: 0.5rem 0 2rem; font-size: 14px; max-width: 1280px; margin: 0 auto; }

    /* stats cards */
    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; border: 0.5px solid var(--color-border-tertiary); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.3px; }
    .stat-value { font-size: 22px; font-weight: 500; color: var(--text-main); line-height: 1.2; }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .pbar-wrap { height: 4px; background: var(--color-background-secondary); border-radius: 2px; margin-top: 6px; overflow: hidden; border: 0.5px solid var(--color-border-secondary); }
    .pbar-fill { height: 100%; border-radius: 2px; background: var(--accent-yen); transition: width 0.5s ease; }

    /* filters + search */
    .controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .fbtn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .fbtn:hover { color: var(--text-main); background: var(--color-background-secondary); }
    .fbtn.on { background: var(--text-main); color: var(--color-background-primary); border-color: transparent; }
    .spacer { flex: 1; }
    .search-box { font-size: 12px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--text-main); font-family: inherit; outline: none; width: 180px; transition: 0.15s; }
    .search-box:focus { border-color: var(--accent-yen); background: var(--color-background-primary); }

    /* phase blocks */
    .phase-block { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; margin-bottom: 1rem; background: var(--color-background-primary); }
    .phase-hdr { display: flex; align-items: center; gap: 10px; padding: 0.65rem 1rem; cursor: pointer; user-select: none; background: var(--color-background-secondary); transition: background 0.1s; }
    .phase-hdr:hover { background: var(--color-background-primary); }
    .phase-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #185FA5; }
    .phase-name { font-size: 13px; font-weight: 500; flex: 1; color: var(--text-main); }
    .phase-meta { font-size: 11px; color: var(--text-muted); background: var(--color-background-secondary); padding: 2px 8px; border-radius: 20px; }
    .phase-chevron { font-size: 14px; color: var(--text-muted); transition: transform 0.2s ease; }
    .phase-block.collapsed .phase-chevron { transform: rotate(-90deg); }
    .phase-body { border-top: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }

    /* week header */
    .week-hdr { display: flex; align-items: center; gap: 8px; padding: 0.5rem 1rem; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); font-weight: 500; }
    .week-label { font-size: 12px; font-weight: 500; flex: 1; color: var(--text-main); }
    .week-prog { font-size: 11px; color: var(--text-muted); }

    /* task row */
    .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 0.55rem 1rem; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background 0.1s; }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: var(--color-background-secondary); }
    .task-row.hidden { display: none; }
    .task-row.is-done .task-text { text-decoration: line-through; color: var(--text-muted); opacity: 0.75; }

    /* checkbox trạng thái */
    .chk { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--color-border-secondary); flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.1s; background: transparent; }
    .chk.done { background: var(--accent-phuong); border-color: var(--accent-phuong); color: #fff; }
    .chk.inprog { background: var(--accent-yen); border-color: var(--accent-yen); color: #fff; }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 13px; line-height: 1.45; color: var(--text-main); word-break: break-word; }
    .task-meta-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }

    /* badge styles (giữ nguyên từ thiết kế) */
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; border: 0.5px solid transparent; display: inline-flex; align-items: center; gap: 4px; }
    .badge-uyen { background: #E6F1FB; color: #0C447C; border-color: #B5D4F4; }
    .badge-phuong { background: #E1F5EE; color: #085041; border-color: #9FE1CB; }
    .badge-cat { background: var(--color-background-secondary); color: var(--text-muted); border-color: var(--color-border-secondary); }
    .badge-priority-high { background: #FCEBEB; color: #791F1F; border-color: #F7C1C1; }
    .badge-priority-med { background: #FAEEDA; color: #633806; border-color: #FAC775; }
    .badge-priority-low { background: #EAF3DE; color: #27500A; border-color: #C0DD97; }

    /* empty message */
    .empty-msg { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 13px; background: var(--color-background-primary); }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.25rem; padding: 0.65rem 1rem; background: var(--color-background-secondary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); font-size: 11px; align-items: center; }
    .leg-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* tiện ích */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>

    <div class="leg-item"><div class="leg-dot" style="background:#534AB7"></div> Phase 5: Polish & Launch</div>
    <div class="leg-item"><span class="badge badge-uyen">Uyên (Frontend/UI)</span></div>
    <div class="leg-item"><span class="badge badge-phuong">Phương (Backend/API)</span></div>
    <div class="leg-item"><span class="badge badge-priority-high">Ưu tiên cao</span></div>
  </div>

  <div class="controls">
    <button class="fbtn on" data-filter="all" onclick="setFilter('all', this)">Tất cả</button>
    <button class="fbtn" data-filter="todo" onclick="setFilter('todo', this)">Chưa làm</button>
    <button class="fbtn" data-filter="inprog" onclick="setFilter('inprog', this)">Đang làm</button>
    <button class="fbtn" data-filter="done" onclick="setFilter('done', this)">Hoàn thành</button>
    <button class="fbtn" data-filter="uyen" onclick="setFilter('uyen', this)">Uyên</button>
    <button class="fbtn" data-filter="phuong" onclick="setFilter('phuong', this)">Phương</button>
    <button class="fbtn" data-filter="high" onclick="setFilter('high', this)">Ưu tiên cao</button>
    <div class="spacer"></div>
    <input class="search-box" type="text" placeholder="Tìm task..." id="searchInput" oninput="doSearch(this.value)" />
  </div>

  <div id="phases-root"></div>
</div>

        { label:'Tuần 18–19: History & Profile', tasks:[
          { id:'p4w3t1', text:'UI Lịch sử học tập: danh sách bài đã làm, kết quả, filter đa chiều', who:'uyen', cat:'UI', pri:'med' },
          { id:'p4w3t2', text:'UI trang Profile / Cài đặt: thông tin tài khoản, ngôn ngữ giao diện, thông báo', who:'uyen', cat:'UI', pri:'med' },
          { id:'p4w3t3', text:'Quản lý liên kết tài khoản: Facebook / Gmail trong Settings', who:'uyen', cat:'UI', pri:'low' },
          { id:'p4w3t4', text:'API: GET /api/history — lịch sử bài đã học, phân trang, filter', who:'phuong', cat:'API', pri:'med' },
          { id:'p4w3t5', text:'Logic review câu sai: tự động gom câu sai vào queue "Cần ôn lại"', who:'phuong', cat:'Logic', pri:'high' },
          { id:'p4w3t6', text:'Hệ thống notification (Supabase Realtime): nhắc học hàng ngày', who:'phuong', cat:'Feature', pri:'low' },
        ]},
      ]
    },
    {
      id:4, name:'Phase 5 — Polish, Testing & Launch', weeks:[
        { label:'Tuần 20–21: Content & QA', tasks:[
          { id:'p5w1t1', text:'Nhập và chuẩn hoá toàn bộ nội dung bài nghe JLPT đang có', who:'uyen', cat:'Content', pri:'high' },
          { id:'p5w1t2', text:'Nhập và chuẩn hoá toàn bộ nội dung bài nghe HSK đang có', who:'uyen', cat:'Content', pri:'high' },
          { id:'p5w1t3', text:'Định nghĩa format chuẩn JSON cho lesson content (audio, script, questions, vocabulary)', who:'phuong', cat:'Content', pri:'high' },
          { id:'p5w1t4', text:'Viết unit tests cho core API endpoints (auth, submissions, vocabulary)', who:'phuong', cat:'Testing', pri:'med' },
          { id:'p5w1t5', text:'Testing toàn bộ luồng: đăng ký → chọn ngôn ngữ → học → nộp bài → xem kết quả', who:'uyen', cat:'Testing', pri:'high' },
          { id:'p5w1t6', text:'Cross-browser testing + mobile responsive testing', who:'uyen', cat:'Testing', pri:'med' },
        ]},
        { label:'Tuần 22–24: Performance & Launch', tasks:[
          { id:'p5w2t1', text:'Tối ưu performance: lazy loading audio, image optimization, code splitting', who:'uyen', cat:'Perf', pri:'med' },
          { id:'p5w2t2', text:'SEO cơ bản: meta tags, OpenGraph, sitemap', who:'uyen', cat:'SEO', pri:'low' },
          { id:'p5w2t3', text:'Setup monitoring: Sentry (error tracking) + Vercel Analytics', who:'phuong', cat:'Infra', pri:'med' },
          { id:'p5w2t4', text:'Database indexing tối ưu, query performance review', who:'phuong', cat:'Perf', pri:'med' },
          { id:'p5w2t5', text:'Security review: Row Level Security (Supabase RLS) cho tất cả tables', who:'phuong', cat:'Security', pri:'high' },
          { id:'p5w2t6', text:'Setup domain, SSL, production deployment', who:'phuong', cat:'DevOps', pri:'high' },
          { id:'p5w2t7', text:'User Acceptance Testing với beta users (5–10 người)', who:'uyen', cat:'Testing', pri:'high' },
          { id:'p5w2t8', text:'Bug fix và release v1.0', who:'phuong', cat:'Launch', pri:'high' },
        ]},
      ]
    },
  ];

  // LƯU TRẠNG THÁI LOCALSTORAGE
  const STATUS_KEY = 'lm_status_v2';
  let statuses = {};
  try { 
    const raw = localStorage.getItem(STATUS_KEY);
    if(raw) statuses = JSON.parse(raw);
  } catch(e) { statuses = {}; }

  function saveStatus() { localStorage.setItem(STATUS_KEY, JSON.stringify(statuses)); }
  function getStatus(id) { return statuses[id] || 'todo'; }

  function cycleStatus(id) {
    const cur = getStatus(id);
    if(cur === 'todo') statuses[id] = 'inprog';
    else if(cur === 'inprog') statuses[id] = 'done';
    else statuses[id] = 'todo';
    saveStatus();
    render();
  }

  function allTasks() { return PHASES.flatMap(p => p.weeks.flatMap(w => w.tasks)); }

  // filter & search state
  let filterMode = 'all';
  let searchQ = '';

  function taskVisible(t) {
    if (filterMode === 'uyen' && t.who !== 'uyen') return false;
    if (filterMode === 'phuong' && t.who !== 'phuong') return false;
    if (filterMode === 'done' && getStatus(t.id) !== 'done') return false;
    if (filterMode === 'inprog' && getStatus(t.id) !== 'inprog') return false;
    if (filterMode === 'todo' && getStatus(t.id) !== 'todo') return false;
    if (filterMode === 'high' && t.pri !== 'high') return false;
    if (searchQ && !t.text.toLowerCase().includes(searchQ)) return false;
    return true;
  }

  function renderStats() {
    const all = allTasks();
    const done = all.filter(t => getStatus(t.id) === 'done').length;
    const inp = all.filter(t => getStatus(t.id) === 'inprog').length;
    const pct = all.length ? Math.round(done/all.length*100) : 0;
    const uyenT = all.filter(t=>t.who==='uyen').length;
    const phuongT = all.filter(t=>t.who==='phuong').length;
    const statsHtml = `
      <div class="stat-card"><div class="stat-label">Tổng tasks</div><div class="stat-value">${all.length}</div><div class="stat-sub">${PHASES.length} phases</div></div>
      <div class="stat-card"><div class="stat-label">Hoàn thành</div><div class="stat-value">${done}</div><div class="stat-sub">${pct}%</div><div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-card"><div class="stat-label">Đang làm</div><div class="stat-value">${inp}</div><div class="stat-sub">in progress</div></div>
      <div class="stat-card"><div class="stat-label">Tasks Uyên</div><div class="stat-value">${uyenT}</div><div class="stat-sub">Frontend/UI</div></div>
      <div class="stat-card"><div class="stat-label">Tasks Phương</div><div class="stat-value">${phuongT}</div><div class="stat-sub">Backend/API</div></div>
    `;
    document.getElementById('stats-row').innerHTML = statsHtml;
  }

  function render() {
    renderStats();
    const root = document.getElementById('phases-root');
    root.innerHTML = '';

    PHASES.forEach((ph, idx) => {
      const allPhaseTasks = ph.weeks.flatMap(w => w.tasks);
      const donePhase = allPhaseTasks.filter(t => getStatus(t.id) === 'done').length;
      const pctPhase = allPhaseTasks.length ? Math.round(donePhase/allPhaseTasks.length*100) : 0;

      const block = document.createElement('div');
      block.className = 'phase-block';
      block.dataset.phase = idx;
      // màu dot lấy theo bảng màu đã định
      const phaseColors = ['#185FA5','#0F6E56','#BA7517','#993C1D','#534AB7'];
      const dotColor = phaseColors[idx] || '#185FA5';

      block.innerHTML = `
        <div class="phase-hdr" onclick="togglePhase(this.parentElement)">
          <div class="phase-dot" style="background:${dotColor}"></div>
          <span class="phase-name">${escapeHtml(ph.name)}</span>
          <span class="phase-meta">${donePhase}/${allPhaseTasks.length} — ${pctPhase}%</span>
          <i class="ti ti-chevron-down phase-chevron" aria-hidden="true"></i>
        </div>
        <div class="phase-body" id="phase-body-${idx}"></div>
      `;
      root.appendChild(block);
      const body = block.querySelector(`.phase-body`);
      let hasVisible = false;

      ph.weeks.forEach(week => {
        const tasksInWeek = week.tasks.filter(taskVisible);
        if (tasksInWeek.length === 0 && (filterMode !== 'all' || searchQ !== '')) return;
        hasVisible = true;
        const weekDoneCount = week.tasks.filter(t => getStatus(t.id) === 'done').length;
        const weekDiv = document.createElement('div');
        weekDiv.innerHTML = `<div class="week-hdr"><span class="week-label">${escapeHtml(week.label)}</span><span class="week-prog">${weekDoneCount}/${week.tasks.length}</span></div>`;
        body.appendChild(weekDiv);

        week.tasks.forEach(t => {
          const visible = taskVisible(t);
          const st = getStatus(t.id);
          const tr = document.createElement('div');
          tr.className = `task-row ${st === 'done' ? 'is-done' : ''} ${!visible ? 'hidden' : ''}`;
          const chkCls = st === 'done' ? 'chk done' : (st === 'inprog' ? 'chk inprog' : 'chk');
          const chkIcon = st === 'done' ? '<i class="ti ti-check" aria-hidden="true"></i>' : (st === 'inprog' ? '<i class="ti ti-dots" aria-hidden="true"></i>' : '');
          const whoBadge = t.who === 'uyen' ? '<span class="badge badge-uyen">Uyên</span>' : '<span class="badge badge-phuong">Phương</span>';
          let priClass = 'badge-priority-low';
          let priLabel = 'Thấp';
          if (t.pri === 'high') { priClass = 'badge-priority-high'; priLabel = 'Cao'; }
          else if (t.pri === 'med') { priClass = 'badge-priority-med'; priLabel = 'Trung bình'; }
          tr.innerHTML = `
            <div class="${chkCls}" onclick="cycleStatus('${t.id}')" role="button" title="Click đổi trạng thái">${chkIcon}</div>
            <div class="task-body">
              <div class="task-text">${escapeHtml(t.text)}</div>
              <div class="task-meta-row">
                ${whoBadge}
                <span class="badge badge-cat">${escapeHtml(t.cat)}</span>
                <span class="badge ${priClass}">${priLabel}</span>
              </div>
            </div>
          `;
          body.appendChild(tr);
        });
      });

      if (!hasVisible && (filterMode !== 'all' || searchQ !== '')) {
        body.innerHTML = `<div class="empty-msg"><i class="ti ti-search"></i> Không có task nào khớp với bộ lọc</div>`;
      }
    });
  }

  function togglePhase(el) { el.classList.toggle('collapsed'); }
  function setFilter(f, btn) {
    filterMode = f;
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
  }
  function doSearch(val) { searchQ = val.toLowerCase().trim(); render(); }

  function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

  window.cycleStatus = cycleStatus;
  window.togglePhase = togglePhase;
  window.setFilter = setFilter;
  window.doSearch = doSearch;

  render();
</script>
</body>
</html>
