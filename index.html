<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ListenMind · Project Tracker (Chỉnh sửa trực tiếp)</title>
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-background-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
      padding: 1rem;
    }
    :root {
      --accent-yen: #185FA5;
      --accent-phuong: #0F6E56;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f8fafc;
      --color-border-tertiary: rgba(0, 0, 0, 0.08);
      --color-border-secondary: rgba(0, 0, 0, 0.12);
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1a1a1a;
        --color-background-secondary: #242424;
        --color-border-tertiary: rgba(255, 255, 255, 0.08);
        --color-border-secondary: rgba(255, 255, 255, 0.12);
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #a0a0a0;
      }
      .badge-uyen { background: #1c3f5c; color: #bbd4f5; border-color: #2c5780; }
      .badge-phuong { background: #1a4f42; color: #b2e0d2; border-color: #217a64; }
      .badge-cat { background: #2d2d2d; color: #b0b0b0; border-color: #3f3f3f; }
      .badge-priority-high { background: #421e1e; color: #f3b5b5; border-color: #832f2f; }
      .badge-priority-med { background: #4a3516; color: #f8d99e; border-color: #a57228; }
      .badge-priority-low { background: #1a3a1a; color: #b3dc8f; border-color: #3c7e1a; }
    }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .top-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; border: 0.5px solid var(--color-border-tertiary); }
    .stat-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
    .stat-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
    .pbar-wrap { height: 4px; background: var(--color-background-secondary); border-radius: 2px; margin-top: 6px; overflow: hidden; border: 0.5px solid var(--color-border-secondary); }
    .pbar-fill { height: 100%; border-radius: 2px; background: var(--accent-yen); transition: width 0.5s; }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .fbtn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: 0.15s; }
    .fbtn.on { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
    .spacer { flex: 1; }
    .search-box { font-size: 12px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-primary); width: 170px; outline: none; }
    .search-box:focus { border-color: var(--accent-yen); }

    .phase-block { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; margin-bottom: 1rem; background: var(--color-background-primary); }
    .phase-hdr { display: flex; align-items: center; gap: 10px; padding: 0.65rem 1rem; cursor: pointer; background: var(--color-background-secondary); }
    .phase-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .phase-name { font-size: 13px; font-weight: 500; flex: 1; }
    .phase-meta { font-size: 11px; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 2px 8px; border-radius: 20px; }
    .phase-chevron { transition: transform 0.2s; }
    .phase-block.collapsed .phase-chevron { transform: rotate(-90deg); }
    .phase-block.collapsed .phase-body { display: none; }
    .phase-body { border-top: 0.5px solid var(--color-border-tertiary); }

    .week-hdr { display: flex; align-items: center; gap: 8px; padding: 0.5rem 1rem; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
    .week-label { font-size: 12px; font-weight: 500; flex: 1; }
    .week-prog { font-size: 11px; color: var(--color-text-secondary); }

    .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 0.55rem 1rem; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background 0.1s; }
    .task-row:hover { background: var(--color-background-secondary); }
    .task-row.is-done .task-text { text-decoration: line-through; opacity: 0.7; }

    .chk { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--color-border-secondary); flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .chk.done { background: var(--accent-phuong); border-color: var(--accent-phuong); color: #fff; }
    .chk.inprog { background: var(--accent-yen); border-color: var(--accent-yen); color: #fff; }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 13px; line-height: 1.45; cursor: pointer; border-radius: 6px; padding: 0 2px; display: inline-block; width: 100%; }
    .task-text[contenteditable="true"] { background: var(--color-background-secondary); outline: none; border: 0.5px solid var(--color-border-secondary); padding: 2px 6px; cursor: text; }
    .task-meta-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; border: 0.5px solid transparent; cursor: pointer; transition: 0.1s; }
    .badge-uyen { background: #E6F1FB; color: #0C447C; border-color: #B5D4F4; }
    .badge-phuong { background: #E1F5EE; color: #085041; border-color: #9FE1CB; }
    .badge-cat { background: var(--color-background-secondary); color: var(--color-text-secondary); border-color: var(--color-border-secondary); }
    .badge-priority-high { background: #FCEBEB; color: #791F1F; border-color: #F7C1C1; }
    .badge-priority-med { background: #FAEEDA; color: #633806; border-color: #FAC775; }
    .badge-priority-low { background: #EAF3DE; color: #27500A; border-color: #C0DD97; }
    .action-icons { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
    .task-row:hover .action-icons, .week-hdr:hover .action-icons, .phase-hdr:hover .action-icons { opacity: 1; }
    .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; color: var(--color-text-secondary); padding: 2px; border-radius: 4px; display: inline-flex; align-items: center; }
    .icon-btn:hover { background: var(--color-border-tertiary); color: var(--color-text-primary); }
    .add-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); padding: 0.6rem 1rem; border-top: 0.5px dashed var(--color-border-secondary); cursor: pointer; background: transparent; width: 100%; transition: 0.15s; }
    .add-btn:hover { color: var(--accent-yen); background: #E6F1FB; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.25rem; padding: 0.65rem 1rem; background: var(--color-background-secondary); border-radius: var(--border-radius-md); font-size: 11px; align-items: center; }
    .leg-item { display: flex; align-items: center; gap: 5px; color: var(--color-text-secondary); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-card { background: var(--color-background-primary); border-radius: 16px; padding: 1.5rem; width: 300px; border: 1px solid var(--color-border-secondary); }
    .color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: inline-block; margin: 4px; border: 2px solid transparent; }
    .color-swatch.selected { border-color: white; outline: 2px solid var(--color-text-primary); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-stats" id="stats-row"></div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="width:10px;height:10px;border-radius:50%;background:#185FA5"></div> Phase 1</div>
    <div class="leg-item"><div class="leg-dot" style="background:#0F6E56;width:10px;height:10px;border-radius:50%"></div> Phase 2</div>
    <div class="leg-item"><div class="leg-dot" style="background:#BA7517"></div> Phase 3</div>
    <div class="leg-item"><div class="leg-dot" style="background:#993C1D"></div> Phase 4</div>
    <div class="leg-item"><div class="leg-dot" style="background:#534AB7"></div> Phase 5</div>
    <div class="leg-item"><span class="badge badge-uyen">Uyên</span></div>
    <div class="leg-item"><span class="badge badge-phuong">Phương</span></div>
    <div class="leg-item"><button class="btn" style="font-size:11px;padding:2px 8px;" onclick="exportAllJSON()">📤 Xuất JSON</button></div>
    <div class="leg-item"><button class="btn" style="font-size:11px;padding:2px 8px;" onclick="document.getElementById('importFile').click()">📥 Nhập JSON</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSONFile(this)"></div>
    <div class="leg-item"><button class="btn" style="font-size:11px;padding:2px 8px;" onclick="if(confirm('Reset về roadmap gốc?')) resetToDefault()">⟳ Reset</button></div>
  </div>
  <div class="controls">
    <button class="fbtn on" data-f="all" onclick="setGlobalFilter('all',this)">Tất cả</button>
    <button class="fbtn" data-f="todo" onclick="setGlobalFilter('todo',this)">Chưa làm</button>
    <button class="fbtn" data-f="inprog" onclick="setGlobalFilter('inprog',this)">Đang làm</button>
    <button class="fbtn" data-f="done" onclick="setGlobalFilter('done',this)">Hoàn thành</button>
    <button class="fbtn" data-f="uyen" onclick="setGlobalFilter('uyen',this)">Uyên</button>
    <button class="fbtn" data-f="phuong" onclick="setGlobalFilter('phuong',this)">Phương</button>
    <button class="fbtn" data-f="high" onclick="setGlobalFilter('high',this)">Ưu tiên cao</button>
    <div class="spacer"></div>
    <input class="search-box" type="text" id="searchInput" placeholder="🔍 Tìm task..." oninput="setSearch(this.value)">
    <button class="fbtn" onclick="addNewPhase()" style="background:var(--accent-yen);color:white">+ Phase mới</button>
  </div>
  <div id="phases-root"></div>
</div>

<script>
  // ----- DEFAULT ROADMAP (giữ nguyên nội dung cũ) -----
  const DEFAULT_PHASES = [
    { id:"ph0", name:"Phase 1 — Foundation & Architecture", color:"#185FA5", weeks:[
      { id:"w0_0", label:"Tuần 1–2: Tech Stack & Setup", tasks:[
        { id:"t1", text:"Quyết định và setup tech stack: Next.js 14 (App Router) + TypeScript", who:"phuong", cat:"Setup", pri:"high", status:"todo" },
        { id:"t2", text:"Lựa chọn và setup database: Supabase (Postgres + Auth + Storage)", who:"phuong", cat:"Setup", pri:"high", status:"todo" },
        { id:"t3", text:"Thiết kế database schema tổng thể: users, lessons, progress, vocabulary, notes, targets", who:"phuong", cat:"Database", pri:"high", status:"todo" },
        { id:"t4", text:"Setup monorepo structure, ESLint, Prettier, Husky", who:"phuong", cat:"DevOps", pri:"med", status:"todo" },
        { id:"t5", text:"Setup design system: Tailwind config, shadcn/ui", who:"uyen", cat:"UI", pri:"high", status:"todo" },
        { id:"t6", text:"Thiết kế wireframe tổng thể (Figma)", who:"uyen", cat:"Design", pri:"high", status:"todo" },
        { id:"t7", text:"Setup CI/CD: GitHub Actions → Vercel + Supabase migrations", who:"phuong", cat:"DevOps", pri:"med", status:"todo" }
      ]},
      { id:"w0_1", label:"Tuần 3–4: Auth & User Onboarding", tasks:[
        { id:"t8", text:"Implement màn hình đăng ký (email/password) — UI đẹp", who:"uyen", cat:"Auth", pri:"high", status:"todo" },
        { id:"t9", text:"Implement màn hình đăng nhập", who:"uyen", cat:"Auth", pri:"high", status:"todo" },
        { id:"t10", text:"Tích hợp OAuth: Google Login", who:"phuong", cat:"Auth", pri:"high", status:"todo" },
        { id:"t11", text:"Tích hợp OAuth: Facebook Login", who:"phuong", cat:"Auth", pri:"high", status:"todo" },
        { id:"t12", text:"Modal chọn ngôn ngữ (Nhật / Trung) sau đăng nhập", who:"uyen", cat:"Onboarding", pri:"high", status:"todo" },
        { id:"t13", text:"Logic phân nhánh JLPT/HSK/FreeStyle vào profile", who:"phuong", cat:"Onboarding", pri:"high", status:"todo" }
      ]}
    ]},
    { id:"ph1", name:"Phase 2 — Core Learning UI", color:"#0F6E56", weeks:[
      { id:"w1_0", label:"Tuần 5–6: Layout & Navigation", tasks:[
        { id:"t14", text:"Implement sidebar navigation: Học / Target / Sổ từ vựng / Lịch sử", who:"uyen", cat:"Layout", pri:"high", status:"todo" },
        { id:"t15", text:"Avatar dropdown + profile settings", who:"uyen", cat:"Layout", pri:"high", status:"todo" },
        { id:"t16", text:"API: GET /api/user/profile", who:"phuong", cat:"API", pri:"high", status:"todo" }
      ]},
      { id:"w1_1", label:"Tuần 7–8: Màn hình Học chính", tasks:[
        { id:"t17", text:"UI màn hình Học: level + danh sách lesson", who:"uyen", cat:"UI", pri:"high", status:"todo" },
        { id:"t18", text:"Widget đếm ngược ngày thi", who:"uyen", cat:"UI", pri:"high", status:"todo" },
        { id:"t19", text:"API: GET /api/lessons filter theo level", who:"phuong", cat:"API", pri:"high", status:"todo" }
      ]}
    ]},
    { id:"ph2", name:"Phase 3 — Learning Experience", color:"#BA7517", weeks:[
      { id:"w2_0", label:"Tuần 9–11: Giao diện luyện tập", tasks:[
        { id:"t20", text:"UI luyện tập: audio player, câu hỏi, đáp án", who:"uyen", cat:"UI", pri:"high", status:"todo" },
        { id:"t21", text:"Highlight từ vựng + popup thêm note", who:"uyen", cat:"Feature", pri:"high", status:"todo" },
        { id:"t22", text:"API nộp bài và lưu kết quả", who:"phuong", cat:"API", pri:"high", status:"todo" }
      ]}
    ]},
    { id:"ph3", name:"Phase 4 — Advanced Features", color:"#993C1D", weeks:[
      { id:"w3_0", label:"Tuần 14–15: Vocabulary & Notes", tasks:[
        { id:"t23", text:"UI Sổ từ vựng: danh sách, filter", who:"uyen", cat:"Feature", pri:"high", status:"todo" },
        { id:"t24", text:"API lưu từ vựng từ script", who:"phuong", cat:"API", pri:"high", status:"todo" }
      ]}
    ]},
    { id:"ph4", name:"Phase 5 — Polish, Testing & Launch", color:"#534AB7", weeks:[
      { id:"w4_0", label:"Tuần 20–21: Content & QA", tasks:[
        { id:"t25", text:"Nhập nội dung bài nghe JLPT / HSK", who:"uyen", cat:"Content", pri:"high", status:"todo" },
        { id:"t26", text:"Unit tests cho API endpoints", who:"phuong", cat:"Testing", pri:"med", status:"todo" }
      ]}
    ]}
  ];

  let phasesData = [];
  let filterMode = "all";
  let searchText = "";
  const STORAGE_KEY = "listenmind_editable_tracker";

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) {
      try {
        phasesData = JSON.parse(saved);
        return;
      } catch(e) {}
    }
    phasesData = JSON.parse(JSON.stringify(DEFAULT_PHASES));
    // đảm bảo mỗi task có status field
    for(let p of phasesData) {
      if(!p.color) p.color = p.id === "ph0" ? "#185FA5" : p.id === "ph1" ? "#0F6E56" : p.id === "ph2" ? "#BA7517" : p.id === "ph3" ? "#993C1D" : "#534AB7";
      for(let w of p.weeks) {
        if(!w.id) w.id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36);
        for(let t of w.tasks) {
          if(!t.status) t.status = "todo";
          if(!t.id) t.id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36);
        }
      }
    }
  }
  function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(phasesData)); }

  function getTaskStatus(task) { return task.status || "todo"; }
  function setTaskStatus(task, st) { task.status = st; saveToLocal(); renderAll(); }

  function toggleStatus(task) {
    const cur = getTaskStatus(task);
    if(cur === "todo") task.status = "inprog";
    else if(cur === "inprog") task.status = "done";
    else task.status = "todo";
    saveToLocal();
    renderAll();
  }

  function allTasksFlat() { return phasesData.flatMap(p => p.weeks.flatMap(w => w.tasks)); }
  function renderStats() {
    const all = allTasksFlat();
    const done = all.filter(t => t.status === "done").length;
    const inprog = all.filter(t => t.status === "inprog").length;
    const pct = all.length ? Math.round(done/all.length*100) : 0;
    const uyenCnt = all.filter(t => t.who === "uyen").length;
    const phuongCnt = all.filter(t => t.who === "phuong").length;
    document.getElementById("stats-row").innerHTML = `
      <div class="stat-card"><div class="stat-label">Tổng tasks</div><div class="stat-value">${all.length}</div><div class="stat-sub">${phasesData.length} phases</div></div>
      <div class="stat-card"><div class="stat-label">Hoàn thành</div><div class="stat-value">${done}</div><div class="stat-sub">${pct}%</div><div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-card"><div class="stat-label">Đang làm</div><div class="stat-value">${inprog}</div></div>
      <div class="stat-card"><div class="stat-label">Uyên</div><div class="stat-value">${uyenCnt}</div></div>
      <div class="stat-card"><div class="stat-label">Phương</div><div class="stat-value">${phuongCnt}</div></div>
    `;
  }

  function taskMatchesFilter(t) {
    if(filterMode === "uyen" && t.who !== "uyen") return false;
    if(filterMode === "phuong" && t.who !== "phuong") return false;
    if(filterMode === "done" && t.status !== "done") return false;
    if(filterMode === "inprog" && t.status !== "inprog") return false;
    if(filterMode === "todo" && t.status !== "todo") return false;
    if(filterMode === "high" && t.pri !== "high") return false;
    if(searchText && !t.text.toLowerCase().includes(searchText)) return false;
    return true;
  }

  function renderAll() {
    renderStats();
    const root = document.getElementById("phases-root");
    root.innerHTML = "";
    phasesData.forEach((phase, pIdx) => {
      const phaseDiv = document.createElement("div");
      phaseDiv.className = "phase-block";
      const totalPhaseTasks = phase.weeks.flatMap(w=>w.tasks);
      const donePhase = totalPhaseTasks.filter(t=>t.status==="done").length;
      const pctPhase = totalPhaseTasks.length ? Math.round(donePhase/totalPhaseTasks.length*100) : 0;
      phaseDiv.innerHTML = `
        <div class="phase-hdr" onclick="togglePhaseCollapse(this.parentElement)">
          <div class="phase-dot" style="background:${phase.color}"></div>
          <span class="phase-name" contenteditable="true" onblur="editPhaseName(${pIdx}, this.innerText)">${escapeHtml(phase.name)}</span>
          <span class="phase-meta">${donePhase}/${totalPhaseTasks.length} — ${pctPhase}%</span>
          <div class="action-icons" style="display:flex;gap:4px;margin-left:auto">
            <button class="icon-btn" onclick="event.stopPropagation();openColorModal(${pIdx})" title="Đổi màu">🎨</button>
            <button class="icon-btn" onclick="event.stopPropagation();deletePhase(${pIdx})" title="Xóa phase">🗑️</button>
          </div>
          <i class="ti ti-chevron-down phase-chevron"></i>
        </div>
        <div class="phase-body" id="phaseBody-${pIdx}"></div>
      `;
      root.appendChild(phaseDiv);
      const bodyDiv = phaseDiv.querySelector(`.phase-body`);
      let anyVisible = false;
      phase.weeks.forEach((week, wIdx) => {
        const filteredTasks = week.tasks.filter(taskMatchesFilter);
        if(filteredTasks.length === 0 && (filterMode !== "all" || searchText)) return;
        anyVisible = true;
        const weekDiv = document.createElement("div");
        weekDiv.className = "week-hdr";
        weekDiv.innerHTML = `
          <span class="week-label" contenteditable="true" onblur="editWeekName(${pIdx},${wIdx},this.innerText)">${escapeHtml(week.label)}</span>
          <span class="week-prog">${week.tasks.filter(t=>t.status==="done").length}/${week.tasks.length}</span>
          <div class="action-icons">
            <button class="icon-btn" onclick="addTaskToWeek(${pIdx},${wIdx})" title="Thêm task">➕</button>
            <button class="icon-btn" onclick="deleteWeek(${pIdx},${wIdx})" title="Xóa tuần">🗑️</button>
          </div>
        `;
        bodyDiv.appendChild(weekDiv);
        week.tasks.forEach((task, tIdx) => {
          if(!taskMatchesFilter(task)) return;
          const isDone = task.status === "done";
          const statusClass = task.status === "done" ? "done" : (task.status === "inprog" ? "inprog" : "");
          const taskRow = document.createElement("div");
          taskRow.className = `task-row ${isDone ? "is-done" : ""}`;
          taskRow.innerHTML = `
            <div class="chk ${statusClass}" onclick="toggleTaskStatus(${pIdx},${wIdx},${tIdx})">${task.status === "done" ? "✓" : task.status === "inprog" ? "▶" : ""}</div>
            <div class="task-body">
              <div class="task-text" contenteditable="true" onblur="editTaskText(${pIdx},${wIdx},${tIdx}, this.innerText)">${escapeHtml(task.text)}</div>
              <div class="task-meta-row">
                <span class="badge ${task.who === 'uyen' ? 'badge-uyen' : 'badge-phuong'}" onclick="cycleWho(${pIdx},${wIdx},${tIdx})">${task.who === 'uyen' ? 'Uyên' : 'Phương'}</span>
                <span class="badge badge-cat" onclick="cycleCat(${pIdx},${wIdx},${tIdx})">${escapeHtml(task.cat)}</span>
                <span class="badge ${task.pri === 'high' ? 'badge-priority-high' : task.pri === 'med' ? 'badge-priority-med' : 'badge-priority-low'}" onclick="cyclePriority(${pIdx},${wIdx},${tIdx})">${task.pri === 'high' ? 'Cao' : task.pri === 'med' ? 'Trung' : 'Thấp'}</span>
              </div>
            </div>
            <div class="action-icons"><button class="icon-btn" onclick="deleteTask(${pIdx},${wIdx},${tIdx})" title="Xóa task">✖️</button></div>
          `;
          bodyDiv.appendChild(taskRow);
        });
        // nút thêm task cuối tuần
        const addTaskBtn = document.createElement("button");
        addTaskBtn.className = "add-btn";
        addTaskBtn.innerHTML = `<i class="ti ti-plus"></i> Thêm task vào tuần này`;
        addTaskBtn.onclick = () => addTaskToWeek(pIdx, wIdx);
        bodyDiv.appendChild(addTaskBtn);
      });
      if(!anyVisible && (filterMode !== "all" || searchText)) {
        bodyDiv.innerHTML = `<div class="empty-msg">🔍 Không có task nào khớp bộ lọc</div>`;
      }
      const addWeekBtn = document.createElement("button");
      addWeekBtn.className = "add-btn";
      addWeekBtn.innerHTML = `<i class="ti ti-plus"></i> + Thêm tuần vào phase này`;
      addWeekBtn.onclick = () => addWeekToPhase(pIdx);
      bodyDiv.appendChild(addWeekBtn);
    });
    const globalAddPhase = document.createElement("button");
    globalAddPhase.className = "add-btn";
    globalAddPhase.style.marginTop = "8px";
    globalAddPhase.innerHTML = `<i class="ti ti-plus"></i> + Thêm phase mới (toàn bộ)`;
    globalAddPhase.onclick = () => addNewPhase();
    root.appendChild(globalAddPhase);
  }

  // Helper edit / delete / add
  window.togglePhaseCollapse = (el) => el.classList.toggle("collapsed");
  window.toggleTaskStatus = (p,w,t) => { toggleStatus(phasesData[p].weeks[w].tasks[t]); };
  window.editTaskText = (p,w,t,val) => { phasesData[p].weeks[w].tasks[t].text = val; saveToLocal(); renderAll(); };
  window.editPhaseName = (idx,val) => { phasesData[idx].name = val; saveToLocal(); renderAll(); };
  window.editWeekName = (p,w,val) => { phasesData[p].weeks[w].label = val; saveToLocal(); renderAll(); };
  window.deleteTask = (p,w,t) => { phasesData[p].weeks[w].tasks.splice(t,1); saveToLocal(); renderAll(); };
  window.deleteWeek = (p,w) => { phasesData[p].weeks.splice(w,1); saveToLocal(); renderAll(); };
  window.deletePhase = (idx) => { if(confirm("Xóa phase này?")) { phasesData.splice(idx,1); saveToLocal(); renderAll(); } };
  window.addTaskToWeek = (p,w) => { phasesData[p].weeks[w].tasks.push({ id: crypto.randomUUID?.()||Date.now(), text:"Task mới", who:"uyen", cat:"Code", pri:"med", status:"todo" }); saveToLocal(); renderAll(); };
  window.addWeekToPhase = (p) => { phasesData[p].weeks.push({ id: crypto.randomUUID?.()||Date.now(), label:"Tuần mới", tasks:[] }); saveToLocal(); renderAll(); };
  window.addNewPhase = () => { phasesData.push({ id:"ph"+Date.now(), name:"Phase mới", color:"#0891B2", weeks:[{ id:"w"+Date.now(), label:"Tuần 1", tasks:[] }] }); saveToLocal(); renderAll(); };
  window.cycleWho = (p,w,t) => { let task = phasesData[p].weeks[w].tasks[t]; task.who = task.who === "uyen" ? "phuong" : "uyen"; saveToLocal(); renderAll(); };
  window.cycleCat = (p,w,t) => { let cats = ["Code","UI","API","Database","DevOps","Auth","Content","Testing","Feature"]; let task = phasesData[p].weeks[w].tasks[t]; let idx = cats.indexOf(task.cat); if(idx===-1) idx=0; task.cat = cats[(idx+1)%cats.length]; saveToLocal(); renderAll(); };
  window.cyclePriority = (p,w,t) => { let prios = ["low","med","high"]; let task = phasesData[p].weeks[w].tasks[t]; let idx = prios.indexOf(task.pri); task.pri = prios[(idx+1)%3]; saveToLocal(); renderAll(); };
  window.openColorModal = (phaseIdx) => { const colors = ["#185FA5","#0F6E56","#BA7517","#993C1D","#534AB7","#0891B2","#D97706"]; const modal = document.createElement("div"); modal.className = "modal-overlay"; modal.innerHTML = `<div class="modal-card"><h4>Chọn màu phase</h4><div id="colorOpts"></div><button onclick="this.closest('.modal-overlay').remove()">Đóng</button></div>`; document.body.appendChild(modal); const cont = modal.querySelector("#colorOpts"); colors.forEach(c=>{ let sw = document.createElement("div"); sw.style.background=c; sw.className="color-swatch"; sw.onclick=()=>{ phasesData[phaseIdx].color=c; saveToLocal(); renderAll(); modal.remove(); }; cont.appendChild(sw); }); };
  window.setGlobalFilter = (mode,btn) => { filterMode = mode; document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); renderAll(); };
  window.setSearch = (val) => { searchText = val.toLowerCase(); renderAll(); };
  window.exportAllJSON = () => { const blob = new Blob([JSON.stringify(phasesData,null,2)], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `listenmind_backup_${new Date().toISOString().slice(0,10)}.json`; a.click(); };
  window.importJSONFile = (input) => { const file = input.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (e) => { try{ const imported = JSON.parse(e.target.result); if(Array.isArray(imported)) { phasesData = imported; saveToLocal(); renderAll(); alert("Nhập thành công!"); } else alert("File không hợp lệ"); } catch(err){ alert("Lỗi JSON"); } }; reader.readAsText(file); input.value=""; };
  window.resetToDefault = () => { phasesData = JSON.parse(JSON.stringify(DEFAULT_PHASES)); saveToLocal(); renderAll(); };
  function escapeHtml(str) { return String(str || "").replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  loadData(); renderAll();
</script>
</body>
</html>
